name: Publish agent image

"on":
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish agent image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out calling repository
        uses: actions/checkout@v7

      - name: Initialize Git submodules
        shell: bash
        run: git submodule update --init --recursive

      - name: Prepare declared dependency inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            printf 'ERROR: %s\n' "$1" >&2
            exit 1
          }

          [[ -f mise.toml ]] || fail 'Agent images require a root mise.toml; no dependency installation was attempted.'
          git diff --quiet || fail 'The checkout contains unexpected changes before dependency inputs were collected.'

          build_dir=.agent-image-inputs
          rm -rf "$build_dir"
          install -d "$build_dir/.agent-image-build"

          copy_input() {
            local path="$1"
            git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 \
              || fail "Dependency input '$path' must be tracked by Git."
            install -D -m 0644 "$path" "$build_dir/$path"
          }

          copy_submodule() {
            local path="$1"

            install -d "$build_dir/$path"
            tar --exclude-vcs -C "$path" -cf - . | tar -C "$build_dir/$path" -xf -
          }

          collect_submodule_manifest_entries() {
            local repository="$1"
            local prefix="$2"
            local entry metadata path mode sha

            while IFS= read -r -d '' entry; do
              metadata="${entry%%$'\t'*}"
              path="${entry#*$'\t'}"
              mode="${metadata%% *}"
              [[ "$mode" == '160000' ]] || continue
              sha="${metadata#* }"
              sha="${sha%% *}"
              printf 'submodule %s %s\n' "$sha" "$prefix$path"
              collect_submodule_manifest_entries "$repository/$path" "$prefix$path/"
            done < <(git -C "$repository" ls-files --stage -z)
          }

          copy_input mise.toml
          lockfiles=()
          while IFS= read -r path; do
            case "$path" in
              package-lock.json|pnpm-lock.yaml|yarn.lock|bun.lock|bun.lockb|uv.lock|poetry.lock|Pipfile.lock|go.sum|Cargo.lock|Gemfile.lock|requirements*.txt)
                lockfiles+=("$path")
                ;;
              */*lock*|*lock*.json|*lock*.yaml|*lock*.yml|*Lock*|*requirements*.txt)
                fail "Cannot derive a deterministic install command for lockfile '$path'. Add support to the shared workflow; do not add a repository build recipe."
                ;;
            esac
          done < <(git ls-files)

          for lockfile in "${lockfiles[@]}"; do
            copy_input "$lockfile"
          done

          while IFS= read -r -d '' submodule_entry; do
            submodule_metadata="${submodule_entry%%$'\t'*}"
            [[ "${submodule_metadata%% *}" == '160000' ]] || continue
            submodule_path="${submodule_entry#*$'\t'}"
            copy_submodule "$submodule_path"
          done < <(git ls-files --stage -z)

          package_locks=0
          for lockfile in package-lock.json pnpm-lock.yaml yarn.lock bun.lock bun.lockb; do
            [[ -f "$lockfile" ]] && ((package_locks += 1))
          done
          (( package_locks <= 1 )) || fail 'More than one JavaScript lockfile is present; the shared workflow will not guess a package manager.'

          install_commands=()
          if [[ -f package-lock.json ]]; then
            [[ -f package.json ]] || fail 'package-lock.json requires package.json.'
            copy_input package.json
            install_commands+=("mise exec -- npm ci")
          elif [[ -f pnpm-lock.yaml ]]; then
            [[ -f package.json ]] || fail 'pnpm-lock.yaml requires package.json.'
            copy_input package.json
            install_commands+=("mise exec -- corepack pnpm install --frozen-lockfile")
          elif [[ -f bun.lock || -f bun.lockb ]]; then
            [[ -f package.json ]] || fail 'bun lockfiles require package.json.'
            copy_input package.json
            install_commands+=("mise exec -- bun install --frozen-lockfile")
          elif [[ -f yarn.lock ]]; then
            fail 'yarn.lock is not supported yet because Yarn release/config discovery is repository-specific. Extend the shared workflow rather than adding a caller recipe.'
          fi

          if [[ -f uv.lock ]]; then
            [[ -f pyproject.toml ]] || fail 'uv.lock requires pyproject.toml.'
            copy_input pyproject.toml
            install_commands+=("mise exec -- uv sync --frozen --no-install-project")
          fi
          if [[ -f poetry.lock || -f Pipfile.lock || -f Gemfile.lock ]]; then
            fail 'poetry.lock, Pipfile.lock, and Gemfile.lock are not supported yet. Extend the shared workflow rather than adding a caller recipe.'
          fi
          for lockfile in "${lockfiles[@]}"; do
            [[ "$lockfile" == requirements*.txt ]] || continue
            if ! grep -Eq -- '--hash=' "$lockfile"; then
              fail "'$lockfile' must use pip hashes before it can be used as an agent-image lockfile."
            fi
            install_commands+=("mise exec -- python -m pip install --require-hashes -r $lockfile")
          done
          if [[ -f go.sum ]]; then
            [[ -f go.mod ]] || fail 'go.sum requires go.mod.'
            copy_input go.mod
            install_commands+=("mise exec -- go mod download")
          fi
          if [[ -f Cargo.lock ]]; then
            [[ -f Cargo.toml ]] || fail 'Cargo.lock requires Cargo.toml.'
            copy_input Cargo.toml
            install_commands+=("mise exec -- cargo fetch --locked")
          fi

          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\n'
            printf 'mise trust --yes mise.toml\n'
            printf 'mise install --yes\n'
            for command in "${install_commands[@]}"; do
              printf '%s\n' "$command"
            done
          } > "$build_dir/.agent-image-build/install-dependencies.sh"
          chmod 0755 "$build_dir/.agent-image-build/install-dependencies.sh"

          manifest_files=()
          for manifest_file in package.json go.mod pyproject.toml Cargo.toml; do
            if git ls-files --error-unmatch -- "$manifest_file" >/dev/null 2>&1; then
              manifest_files+=("$manifest_file")
            fi
          done

          {
            sha256sum mise.toml
            for lockfile in "${lockfiles[@]}"; do sha256sum "$lockfile"; done
            for manifest_file in "${manifest_files[@]}"; do sha256sum "$manifest_file"; done
            collect_submodule_manifest_entries '.' ''
          } | LC_ALL=C sort > "$build_dir/.agent-image-build/dependency-manifest.inputs"
          manifest_sha="$(sha256sum "$build_dir/.agent-image-build/dependency-manifest.inputs" | awk '{print $1}')"
          printf '%s\n' "$manifest_sha" > "$build_dir/.agent-image-build/dependency-manifest.sha256"

          {
            printf '%s\n' 'ARG BROKER_REVISION=892c1a1c3f6069f0b2006d6f7ee65226d7eb28fd'
            printf '%s\n' 'FROM --platform=$BUILDPLATFORM golang:1.26.5 AS broker-source'
            printf '%s\n' 'ARG TARGETOS'
            printf '%s\n' 'ARG TARGETARCH'
            printf '%s\n' 'ARG BROKER_REVISION'
            printf '%s\n' 'RUN git init /src && git -C /src remote add origin https://github.com/grubbyhacker/gh-agent-broker.git && git -C /src fetch --depth 1 origin "$BROKER_REVISION" && git -C /src checkout --detach FETCH_HEAD && test "$(git -C /src rev-parse HEAD)" = "$BROKER_REVISION"'
            printf '%s\n' 'RUN test -s /src/workers/repo-task/worker.sh && test -s /src/workers/codex-repo-prep/worker.sh && test -s /src/workers/codex-repo-task/worker.sh && test -s /src/workers/codex-delivery/worker.sh && test -s /src/workers/result.sh && cd /src && mkdir -p /out && CGO_ENABLED=0 GOOS="$TARGETOS" GOARCH="$TARGETARCH" go build -o /out/gh-agent-broker-cli ./cmd/gh-agent-broker && git rev-parse HEAD > /out/broker-source-revision'
            printf '%s\n' 'FROM ghcr.io/jdx/mise:2026.7.15@sha256:e62097049bfc980de5d9a25fbe16431e24c1e7713b3f77b18c04f81c25239953 AS mise'
            printf '%s\n' 'FROM debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd'
            printf '%s\n' 'ARG BROKER_REVISION'
            printf '%s\n' 'ENV MISE_DATA_DIR=/opt/mise MISE_CONFIG_DIR=/opt/mise MISE_CACHE_DIR=/opt/mise/cache PATH=/opt/mise/shims:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin'
            printf '%s\n' 'RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates curl fd-find git jq ripgrep tar && rm -rf /var/lib/apt/lists/* && ln -s /usr/bin/fdfind /usr/local/bin/fd'
            printf '%s\n' 'COPY --from=mise /usr/local/bin/mise /usr/local/bin/mise'
            printf '%s\n' 'COPY --from=broker-source /out/gh-agent-broker-cli /usr/local/bin/gh-agent-broker-cli'
            printf '%s\n' 'COPY --from=broker-source /out/broker-source-revision /usr/local/share/agent-image/broker-source-revision'
            printf '%s\n' 'COPY --from=broker-source /src/workers/repo-task/worker.sh /usr/local/bin/agent-repo-task-worker'
            printf '%s\n' 'COPY --from=broker-source /src/workers/codex-repo-prep/worker.sh /usr/local/bin/agent-codex-repo-prep-worker'
            printf '%s\n' 'COPY --from=broker-source /src/workers/codex-repo-task/worker.sh /usr/local/bin/agent-codex-repo-task-worker'
            printf '%s\n' 'COPY --from=broker-source /src/workers/codex-delivery/worker.sh /usr/local/bin/agent-codex-delivery-worker'
            printf '%s\n' 'COPY --from=broker-source /src/workers/result.sh /usr/local/lib/agent-worker-result.sh'
            printf '%s\n' 'ARG TARGETARCH'
            printf '%s\n' 'ARG CODEX_VERSION=0.146.0'
            printf '%s\n' 'RUN case "$TARGETARCH" in amd64) codex_arch=x64; codex_target=x86_64-unknown-linux-musl; codex_sha512=7ecc2fc86a6b00f08c88e12e7bfecc28c93ba428e1f6464825f257e62f5ab667e798661b602714859b041fd2c43f4fb4b79c723ea0db7cd5d8ecd4b1215b97c4 ;; arm64) codex_arch=arm64; codex_target=aarch64-unknown-linux-musl; codex_sha512=aa2603c649041675c6ee3a1a7495ba43e5dc8320d70a919da5af6793f73e8b4804a26babd63edb1efc75d8d7d658217fcbc4eaae2e9acbe14bb82d8c8dd7a1b4 ;; *) printf "Unsupported Codex architecture: %s\\n" "$TARGETARCH" >&2; exit 1 ;; esac && curl -fsSL "https://registry.npmjs.org/@openai/codex/-/codex-${CODEX_VERSION}-linux-${codex_arch}.tgz" -o /tmp/codex.tgz && printf "%s  /tmp/codex.tgz\\n" "$codex_sha512" | sha512sum -c - && install -d /tmp/codex /opt/codex && tar -xzf /tmp/codex.tgz -C /tmp/codex --strip-components=1 && cp -a "/tmp/codex/vendor/${codex_target}/." /opt/codex/ && ln -s /opt/codex/bin/codex /usr/local/bin/codex && rm -rf /tmp/codex /tmp/codex.tgz'
            printf '%s\n' 'RUN chmod 0755 /usr/local/bin/mise /usr/local/bin/gh-agent-broker-cli /usr/local/bin/agent-repo-task-worker /usr/local/bin/agent-codex-repo-prep-worker /usr/local/bin/agent-codex-repo-task-worker /usr/local/bin/agent-codex-delivery-worker /usr/local/lib/agent-worker-result.sh /usr/local/bin/codex && test "$(cat /usr/local/share/agent-image/broker-source-revision)" = "$BROKER_REVISION" && test -x /usr/local/bin/gh-agent-broker-cli && test -x /usr/local/bin/agent-repo-task-worker && test -x /usr/local/bin/agent-codex-repo-prep-worker && test -x /usr/local/bin/agent-codex-repo-task-worker && test -x /usr/local/bin/agent-codex-delivery-worker && test -x /usr/local/lib/agent-worker-result.sh'
            printf '%s\n' 'WORKDIR /workspace'
            printf '%s\n' 'COPY .agent-image-inputs/ /workspace/'
            printf '%s\n' 'RUN /workspace/.agent-image-build/install-dependencies.sh && rm -rf /workspace/.agent-image-build'
            printf '%s\n' 'COPY .agent-image-inputs/.agent-image-build/dependency-manifest.sha256 /usr/local/share/agent-image/dependency-manifest.sha256'
            printf '%s\n' 'ARG DEPENDENCY_MANIFEST_SHA256'
            printf '%s\n' 'LABEL io.grubbyhacker.agent-image.dependency-manifest=$DEPENDENCY_MANIFEST_SHA256'
            printf '%s\n' 'LABEL io.grubbyhacker.agent-image.broker-source-revision=$BROKER_REVISION'
            printf '%s\n' 'CMD ["bash"]'
          } > "$build_dir/Dockerfile"

          printf 'manifest_sha=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s-agent\n' "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.inputs.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build agent image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .agent-image-inputs/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: agent-image-verification:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPENDENCY_MANIFEST_SHA256=${{ steps.inputs.outputs.manifest_sha }}

      - name: Assert broker source provenance and installed entrypoints
        env:
          IMAGE: agent-image-verification:${{ github.sha }}
          BROKER_SOURCE_REVISION: 892c1a1c3f6069f0b2006d6f7ee65226d7eb28fd
        run: |
          set -euo pipefail
          [[ "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" == amd64 ]]
          [[ "$(docker image inspect --format '{{ index .Config.Labels "io.grubbyhacker.agent-image.broker-source-revision" }}' "$IMAGE")" == "$BROKER_SOURCE_REVISION" ]]
          docker run --rm --entrypoint bash -e BROKER_SOURCE_REVISION "$IMAGE" -euo pipefail -c '
            [[ "$(uname -m)" == x86_64 ]]
            [[ "$(cat /usr/local/share/agent-image/broker-source-revision)" == "$BROKER_SOURCE_REVISION" ]]
            for entrypoint in \
              /usr/local/bin/gh-agent-broker-cli \
              /usr/local/bin/agent-repo-task-worker \
              /usr/local/bin/agent-codex-repo-prep-worker \
              /usr/local/bin/agent-codex-repo-task-worker \
              /usr/local/bin/agent-codex-delivery-worker \
              /usr/local/lib/agent-worker-result.sh; do
              [[ -f "$entrypoint" && -x "$entrypoint" ]] || {
                printf "ERROR: required executable %s is missing.\\n" "$entrypoint" >&2
                exit 1
              }
            done
          '

      - name: Assert forbidden clients are absent from the built image
        env:
          IMAGE: agent-image-verification:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "$IMAGE" -euo pipefail -c '
            forbidden_command_patterns="gh tofu opentofu ansible* doppler ssh ssh-* scp sftp dbclient"
            for pattern in $forbidden_command_patterns; do
              for command in $(compgen -c | LC_ALL=C sort -u); do
                [[ "$command" == $pattern ]] || continue
                printf "ERROR: forbidden command %s is present at %s\\n" "$command" "$(command -v "$command")" >&2
                exit 1
              done
            done
            if dpkg-query -W -f="\${Status}" openssh-client 2>/dev/null | grep -q "install ok installed"; then
              printf "%s\\n" "ERROR: openssh-client is installed." >&2
              exit 1
            fi
            declare -A scanned_directories=()
            IFS=: read -r -a path_directories <<< "$PATH"
            path_directories+=(/bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin)
            for directory in "${path_directories[@]}"; do
              [[ -n "$directory" && -d "$directory" ]] || continue
              [[ -n "${scanned_directories[$directory]:-}" ]] && continue
              scanned_directories[$directory]=1
              while IFS= read -r -d "" client; do
                basename="${client##*/}"
                case "$basename" in
                  gh|tofu|opentofu|ansible*|doppler|ssh|ssh-*|scp|sftp|dbclient)
                    if [[ -x "$client" ]]; then
                      printf "ERROR: forbidden executable client exists at %s\\n" "$client" >&2
                      exit 1
                    fi
                    ;;
                esac
              done < <(find "$directory" -maxdepth 1 \( -type f -o -type l \) -print0)
            done
          '

      - name: Publish verified agent image for supported platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .agent-image-inputs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPENDENCY_MANIFEST_SHA256=${{ steps.inputs.outputs.manifest_sha }}
